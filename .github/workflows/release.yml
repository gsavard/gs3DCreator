name: Publication

# Pousse une étiquette « vX.Y.Z » pour construire les paquets et créer la version GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquets:
    # Ubuntu 22.04 (glibc 2.35) : le binaire fonctionne sur Fedora 36+, Debian 12+, Ubuntu 22.04+
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Outils d'empaquetage
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Paquets RPM et DEB
        run: ./scripts/paquets.sh
      - name: Sommes de contrôle
        run: cd dist && sha256sum *.rpm *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: paquets
          path: dist/*
      - name: Version GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
