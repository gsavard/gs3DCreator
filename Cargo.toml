[package]
name = "gs3dcreator"
version = "2.2.1"
edition = "2024"
rust-version = "1.85"
description = "Découpe un modèle 3D (figurine, statue) en pièces imprimables avec rotules, goujons ou tenons d'assemblage"
authors = ["Guillaume Savard <guillaume.savard@k-trail.ca>"]
license = "MIT"
repository = "https://github.com/gsavard/gs3DCreator"
homepage = "https://github.com/gsavard/gs3DCreator"
readme = "README.md"
keywords = ["3d-printing", "stl", "mesh", "slicer", "3mf"]
categories = ["command-line-utilities", "graphics"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
geo = "0.33.1"
gltf = "1.4.1"
manifold3d = { version = "0.4.1", default-features = false }
mime_guess = "2.0.5"
nalgebra = "0.35.0"
ply-rs = "0.1.3"
polylabel = "3.3.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stl_io = "0.11.0"
thiserror = "2.0.21"
tobj = "4.0.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# ---------------------------------------------------------------- paquet .deb (cargo deb)
[package.metadata.deb]
name = "gs3dcreator"
maintainer = "Guillaume Savard <guillaume.savard@k-trail.ca>"
copyright = "2026, Guillaume Savard"
section = "graphics"
priority = "optional"
depends = "$auto, xdg-utils"
recommends = "libnotify-bin"
extended-description = """\
gs3Dcreator découpe un modèle 3D (STL, OBJ, GLB, PLY, 3MF, OFF) en pièces \
imprimables : gabarits de personnage de 2 à 6 pièces, plans de coupe libres, \
rotules, goujons ou tenons d'assemblage, export STL/3MF. Interface web locale \
avec aperçu 3D et outils en ligne de commande."""
assets = [
  ["target/release/gs3dcreator", "usr/bin/", "755"],
  ["packaging/gs3dcreator.desktop", "usr/share/applications/", "644"],
  ["packaging/gs3dcreator.metainfo.xml", "usr/share/metainfo/", "644"],
  ["assets/icons/icone_16.png", "usr/share/icons/hicolor/16x16/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_24.png", "usr/share/icons/hicolor/24x24/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_32.png", "usr/share/icons/hicolor/32x32/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_48.png", "usr/share/icons/hicolor/48x48/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_64.png", "usr/share/icons/hicolor/64x64/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_128.png", "usr/share/icons/hicolor/128x128/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_256.png", "usr/share/icons/hicolor/256x256/apps/gs3dcreator.png", "644"],
  ["assets/icons/icone_512.png", "usr/share/icons/hicolor/512x512/apps/gs3dcreator.png", "644"],
  ["packaging/gs3dcreator.1", "usr/share/man/man1/", "644"],
  ["README.md", "usr/share/doc/gs3dcreator/", "644"],
  ["docs/GUIDE.md", "usr/share/doc/gs3dcreator/", "644"],
]

# ---------------------------------------------------------------- paquet .rpm (cargo generate-rpm)
[package.metadata.generate-rpm]
name = "gs3dcreator"
summary = "Découpe de modèles 3D en pièces imprimables"
license = "MIT"
url = "https://github.com/gsavard/gs3DCreator"
assets = [
  { source = "target/release/gs3dcreator", dest = "/usr/bin/gs3dcreator", mode = "755" },
  { source = "packaging/gs3dcreator.desktop", dest = "/usr/share/applications/gs3dcreator.desktop", mode = "644" },
  { source = "packaging/gs3dcreator.metainfo.xml", dest = "/usr/share/metainfo/gs3dcreator.metainfo.xml", mode = "644" },
  { source = "assets/icons/icone_16.png", dest = "/usr/share/icons/hicolor/16x16/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_24.png", dest = "/usr/share/icons/hicolor/24x24/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_32.png", dest = "/usr/share/icons/hicolor/32x32/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_48.png", dest = "/usr/share/icons/hicolor/48x48/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_64.png", dest = "/usr/share/icons/hicolor/64x64/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_128.png", dest = "/usr/share/icons/hicolor/128x128/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/gs3dcreator.png", mode = "644" },
  { source = "assets/icons/icone_512.png", dest = "/usr/share/icons/hicolor/512x512/apps/gs3dcreator.png", mode = "644" },
  { source = "packaging/gs3dcreator.1", dest = "/usr/share/man/man1/gs3dcreator.1", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/gs3dcreator/README.md", mode = "644", doc = true },
  { source = "docs/GUIDE.md", dest = "/usr/share/doc/gs3dcreator/GUIDE.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/gs3dcreator/LICENSE", mode = "644", doc = true },
]
post_install_script = "packaging/post-install.sh"
post_uninstall_script = "packaging/post-install.sh"

[package.metadata.generate-rpm.requires]
xdg-utils = "*"
